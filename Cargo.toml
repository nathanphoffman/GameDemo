[workspace]
members = ["game-core", "game-net", "host"]

[package]
name = "gamedemo"
version = "0.1.0"
edition = "2024"

[dependencies]
game-core = { path = "game-core" }
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.29"
pollster = "1.0.1"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
wgpu = "24"
winit = "0.30.13"
